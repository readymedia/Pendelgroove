<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bygg polyrytmer der hvert lag er en pendel du ser og hører. 23 EDM-sjangre med regler, forklaringer og rutenett.">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pendelgroove">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Pendelgroove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 16:9 instrument. Top bar = genre picker + sibling subgenres + transport. Left = stage (pendulum or grid view, lesson captions). Right = layer rack. Each subgenre repaints the room. Stacks in portrait. */
:root{
  color-scheme: dark;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  --bg:#0a0b0d;
  --accent:#9db8d9;
  --panel:#111318;
  --raised:#181b21;
  --line:#242830;
  --glow:#16181e;
  --fg:#ece9e4;
  --muted:#8a8d97;
  --faint:#3a3e47;
  --display:"Syncopate", "Arial Black", sans-serif;
  --body:"IBM Plex Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  --tap:44px;
}
@supports (color: color-mix(in srgb, red 50%, blue)){
  :root{
    --panel:color-mix(in srgb, var(--accent) 5%, #0f1115);
    --raised:color-mix(in srgb, var(--accent) 11%, #15171c);
    --line:color-mix(in srgb, var(--accent) 13%, #22252c);
    --glow:color-mix(in srgb, var(--accent) 13%, var(--bg));
  }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;transition:background-color .5s;
  -webkit-user-select:none;user-select:none;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:10px}
button,select,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:600}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.24em;white-space:nowrap;line-height:1.1}
.brand span{color:var(--accent);transition:color .5s}
.picker{flex:none;min-height:var(--tap);display:flex;align-items:center;gap:10px;padding:4px 10px 4px 12px;border:1px solid var(--accent);border-radius:9px;background:var(--raised);text-align:left}
.picker i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
.picker small{display:block;font-family:var(--display);font-size:8.5px;letter-spacing:.2em;color:var(--muted);line-height:1.3}
.picker b{display:block;font-size:15px;line-height:1.15;white-space:nowrap}
.picker svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent calc(100% - 12px));mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent calc(100% - 12px));padding-right:40px}
.subs::-webkit-scrollbar{display:none}
.sub{flex:none;min-height:var(--tap);padding:4px 12px 4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:center;line-height:1.15;color:var(--muted);position:relative;text-align:left}
.sub i{grid-row:span 2;width:8px;height:8px;border-radius:50%;background:var(--gc)}
.sub b{font-size:13.5px;color:inherit;white-space:nowrap}
.sub small{font-family:var(--mono);font-size:10.5px}
.sub[aria-pressed=true]{color:var(--fg);border-color:var(--gc);background:var(--raised)}
.sub[data-mod=true]::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--fg)}
.tempo{display:flex;align-items:center;gap:8px;flex:none}
.knob{display:flex;flex-direction:column;gap:2px;min-width:96px}
.knob label{display:flex;justify-content:space-between;font-family:var(--display);font-size:9px;letter-spacing:.2em;color:var(--muted)}
.knob output{font-family:var(--mono);font-size:12px;color:var(--fg);letter-spacing:0;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--faint)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--faint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-9px;border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.btn{min-width:var(--tap);height:var(--tap);border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.btn:active{background:var(--raised);color:var(--fg)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.play{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;flex:none;transition:transform .1s, background-color .2s}
.play:active{transform:scale(.94)}
.play svg{width:22px;height:22px;fill:var(--accent)}
.play.on{background:var(--accent)}
.play.on svg{fill:var(--bg)}

/* ---- main ---- */
.main{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:10px;min-height:0}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 75% at 50% 0%, var(--glow) 0%, var(--bg) 72%)}
.stbar{display:flex;align-items:center;gap:6px;padding:8px 8px 0;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{height:34px;padding:0 12px;border-radius:6px;color:var(--muted);font-size:13px}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--fg)}
.sp{flex:1}
.learn{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.learn svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.learn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.learn[aria-pressed=true] svg{stroke:var(--bg)}
.qbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:600}
.cbox{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.cap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 16px 14px;text-align:center;min-height:150px;justify-content:flex-end}
.eyebrow{font-family:var(--display);font-size:10px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.chords{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chords span{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chords span.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.big{font-size:clamp(15px,1.6vw,20px);font-weight:500;text-wrap:balance;max-width:44ch}
.desc{color:var(--muted);font-size:13px;max-width:56ch;text-wrap:pretty}
.desc b{color:var(--fg)}
.rdash{display:flex;gap:6px}
.rdash i{width:26px;height:2px;border-radius:1px;background:var(--faint)}
.rdash i.on{background:var(--accent)}
.rtitle{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,27px);letter-spacing:.01em;text-transform:uppercase;line-height:1.15;text-wrap:balance;max-width:24ch}
.rtitle em{font-style:normal;color:var(--accent);text-shadow:0 0 18px var(--accent)}
.rhint{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.lnav{display:flex;align-items:center;gap:8px;width:100%;max-width:440px}
.lnav button{width:40px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:17px}
.lnav .bar{flex:1;height:3px;background:var(--faint);border-radius:2px;overflow:hidden}
.lnav .bar i{display:block;height:100%;background:var(--accent);width:0}
.lnav .x{width:auto;padding:0 10px;font-size:12px}
.cycle{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dots i.on{background:var(--accent)}

.rack{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.layer{flex:1 1 0;min-height:86px;display:flex;flex-direction:column;gap:7px;padding:9px 10px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;--c:#888;transition:opacity .25s}
.layer.muted{opacity:.45}
.layer.dim{opacity:.42}
.layer.off{opacity:.16}
.layer.focus{border-color:var(--c)}
.layer.flash{animation:flash .5s ease-out}
@keyframes flash{from{border-color:var(--c)}}
.lhead{display:flex;align-items:center;gap:6px;min-width:0}
.sw{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
select{height:38px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 8px;min-width:0;max-width:150px}
.len{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:7px;height:38px;flex:none}
.len button{width:36px;height:100%;font-family:var(--mono);font-size:18px;color:var(--muted)}
.len button:active{color:var(--fg)}
.len span{display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:50px;font-variant-numeric:tabular-nums}
.len b{font-family:var(--mono);font-weight:500;font-size:14px}
.len small{font-size:10px;color:var(--muted)}
.ic{width:38px;height:38px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.ic:active{background:var(--raised);color:var(--fg)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic[aria-pressed=true]{color:var(--accent)}
.pads{flex:1;display:grid;gap:4px;grid-auto-rows:minmax(26px,1fr);touch-action:none;min-height:26px}
.pad{border-radius:5px;background:var(--bg);border:1px solid var(--line);position:relative}
.pad.b{border-color:var(--faint)}
.pad.g{margin-left:5px}
.pad.on{background:var(--c);border-color:var(--c)}
.pad.now{box-shadow:inset 0 0 0 2px var(--fg)}
.pad.on.now{animation:pop .2s ease-out;filter:brightness(1.35)}
@keyframes pop{from{transform:scale(1.12)}to{transform:scale(1)}}
.add{flex:none;min-height:var(--tap);border:1px dashed var(--faint);border-radius:10px;color:var(--muted)}

/* ---- sheet (genre picker, glossary) ---- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.66);display:flex;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet-in{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(1120px,100%);overflow:auto;overscroll-behavior:contain;padding:16px 20px 28px;-webkit-user-select:text;user-select:text}
.sheet-h{display:flex;align-items:center;gap:12px;position:sticky;top:-16px;background:var(--bg);padding-block:10px;margin-top:-10px;z-index:1}
.sheet-h h2{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.16em;text-transform:uppercase}
.sheet-h p{margin:0;color:var(--muted);font-size:13px}
.close{margin-left:auto;width:var(--tap);height:var(--tap);border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fam{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.famh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.famh h3{font-family:var(--display);font-size:13px;letter-spacing:.2em;margin:0;text-transform:uppercase;color:var(--fc)}
.famh span{color:var(--muted);font-size:13px}
.famh small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.tile{text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-height:92px}
.tile:active{background:var(--raised)}
.tile[aria-current=true]{border-color:var(--tc);background:var(--raised)}
.tile .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.tile .nm i{width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.tile small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px;margin:8px 0 0}
.gl div{padding:10px 0;border-top:1px solid var(--line)}
.gl dt{font-weight:600}
.gl dd{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.howto{margin:18px 0 0;padding-left:18px;color:var(--muted);display:grid;gap:6px;font-size:14px}
.howto b{color:var(--fg)}
.sheet h4{margin:22px 0 0;font-family:var(--display);font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}

/* ---- start wizard ---- */
.wiz{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;overscroll-behavior:contain;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wz{max-width:1060px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.wz-top{display:flex;align-items:center;gap:16px}
.wz-dots{display:flex;gap:6px;margin-left:auto}
.wz-dots i{width:28px;height:3px;border-radius:2px;background:var(--faint)}
.wz-dots i.on{background:var(--accent)}
.wz-skip{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px}
.wz-head{display:flex;flex-direction:column;gap:8px;margin-top:2vh}
.wz-head .eyebrow{color:var(--muted)}
.wz-head h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.4vw,40px);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.wz-head h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 22px var(--accent)}
.wz-head p{margin:0;color:var(--muted);max-width:62ch}
.wz-grid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.wz-grid.goals .wz-card{min-height:min(46vh,340px);justify-content:flex-end;padding:24px}
.wz-grid.goals .wz-card h3{font-size:clamp(20px,2.2vw,28px)}
.wz-grid.goals .wz-card p{font-size:15px}
.wz-grid.goals .rec{position:absolute;top:18px;left:18px}
.wz-grid.goals .wz-card{position:relative}
.wz-grid.goals .gi{width:44px;height:44px;margin-bottom:auto;margin-top:34px}
.wz-grid.subs3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.wz-card{text-align:left;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-height:150px;transition:border-color .15s,transform .1s,background-color .15s;--fc:var(--accent)}
.wz-card:hover,.wz-card:focus-visible{border-color:var(--fc);background:var(--raised)}
.wz-card:active{transform:scale(.98)}
.wz-card h3{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.wz-card h3 i{width:12px;height:12px;border-radius:50%;background:var(--fc);box-shadow:0 0 12px var(--fc);flex:none}
.wz-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.wz-card small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wz-card .tease{margin-top:auto;padding-top:6px;font-size:13px;color:var(--fg);opacity:.85}
.wz-card .tease b{color:var(--fc)}
.wz-card .gi{width:36px;height:36px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wz-card .rec{align-self:flex-start;font-size:11px;font-family:var(--display);letter-spacing:.16em;color:var(--bg);background:var(--accent);padding:3px 8px;border-radius:999px;text-transform:uppercase}
.wz-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.wz-back{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.wz-resume{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);color:var(--fg);background:var(--raised)}
.wz-note{color:var(--muted);font-size:13px}
#adv[aria-pressed=true]{color:var(--fg);border-color:var(--accent)}
.brand{text-align:left;color:var(--fg);cursor:pointer;padding:4px 2px;border-radius:6px}
body.simple #swKnob,body.simple #tap,body.simple #variant,body.simple .len,body.simple .ic[data-a=swap],body.simple .ic[data-a=dice],body.simple .ic[data-a=del],body.simple .add{display:none}

/* ---- portrait / narrow ---- */
@media (max-aspect-ratio: 1/1), (max-width: 760px){
  body{overflow:auto;height:auto}
  html{height:auto}
  .app{height:auto}
  .top{flex-wrap:wrap}
  .subs{order:3;flex-basis:100%}
  .picker{flex:1}
  .tempo{flex-basis:100%;gap:6px;order:4}
  .knob{min-width:0;flex:1 1 64px}
  #fs{display:none}
  .play{width:48px;height:48px}
  .main{grid-template-columns:minmax(0,1fr)}
  .cbox{flex:none;height:min(78vw,440px)}
  .rack{overflow:visible}
  .layer{flex:none}
  .pads{grid-auto-rows:40px}
  .lhead{gap:3px}
  select{max-width:84px;padding:0 3px}
  .len button{width:30px}
  .len span{min-width:30px}
  .len small{display:none}
  .ic{width:32px}
  .btn.variant span{display:none}
  .learn span{display:none}
  .wz-grid{grid-template-columns:minmax(0,1fr)}
  .wz-card,.wz-grid.goals .wz-card{min-height:0}
  .wz-grid.goals .gi{margin-top:30px}
  .wz-head{margin-top:0}
  .stbar{flex-wrap:nowrap}
  .seg button{padding:0 9px}
  .learn{padding:0 9px}
}
@media (prefers-reduced-motion: reduce){.pad.on.now,.layer.flash{animation:none}.play,body,.layer{transition:none}}
</style>
</head>
<body>

<div class="app">

const GENRES={};
FAMILIES.forEach(f=>f.subs.forEach(s=>{s.fam=f;s.c=[s.acc,...f.c.filter(c=>c!==s.acc)].slice(0,6);GENRES[s.id]=s}));
const G=()=>GENRES[state.genre];

/* chords */
const PCS={C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
const QUAL={"":[0,4,7],m:[0,3,7],m7:[0,3,7,10],maj7:[0,4,7,11],"7":[0,4,7,10],m9:[0,3,7,10,14],sus2:[0,2,7]};
const pretty=n=>n.replace(/^([A-G])b/,"$1♭").replace(/^([A-G])#/,"$1♯");
function chordsOf(gen){
  if(!gen._ch)gen._ch=gen.prog.map(n=>{const m=n.match(/^([A-G][b#]?)(.*)$/);let d=(PCS[m[1]]-PCS[gen.tonic]+12)%12;if(d>6)d-=12;return{name:pretty(n),r:d,q:QUAL[m[2]]||QUAL[""]}});
  return gen._ch;
}
const chordAt=g=>{const c=chordsOf(G());return c[Math.floor(g/16)%c.length]};
const progTxt=()=>chordsOf(G()).map(c=>c.name).join(" – ");

let state;
const P=s=>s.split("").map(c=>c==="x"?1:0);
const pad32=a=>{const s=a.slice(0,32);while(s.length<32)s.push(0);return s};
function loadGenre(key){
  const g=GENRES[key];
  state={genre:key,mod:false,bpm:g.bpm,swing:g.sw,
    layers:g.L.map((d,i)=>({sound:d[0],len:d[2].length,steps:pad32(P(d[2])),mute:false,gi:i,color:g.c[i%6]}))};
}
try{const s=JSON.parse(localStorage.getItem("pendelgroove-v4"));if(s&&s.layers&&GENRES[s.genre])state=s}catch(e){}
if(!state)loadGenre("hypno");
let view="pend";try{view=localStorage.getItem("pendelgroove-view")||"pend"}catch(e){}
function save(){try{localStorage.setItem("pendelgroove-v4",JSON.stringify(state))}catch(e){}}

const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
const cycleSteps=()=>state.layers.reduce((a,l)=>lcm(a,l.len),16);
function beats(n){const b=n/4;return Number.isInteger(b)?String(b):(Math.round(b*100)/100).toString().replace(".",",")}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const def=l=>l.gi!=null?G().L[l.gi]:null;
function poolOf(l){const d=def(l);return d?d[1]:Object.keys(SOUNDS).filter(k=>roleOf(k)===roleOf(l.sound))}

function regen(l){
  const d=def(l);
  if(d){
    const tpl=[d[2],...d[3]];
    if(d[4]&&Math.random()<.35){randomize(l,pick(tpl).length,d[4]);return}
    let p=pick(tpl);if(tpl.length>1){let k=0;while(p.length===l.len&&P(p).every((v,i)=>v===l.steps[i])&&k++<8)p=pick(tpl)}
    l.len=p.length;l.steps=pad32(P(p));
  }else randomize(l,l.len,ROLE_DENS[roleOf(l.sound)]||.3);
}
function randomize(l,len,dens){
  l.len=len;for(let s=0;s<32;s++)l.steps[s]=Math.random()<dens?1:0;
  if(roleOf(l.sound)==="kick")l.steps[0]=1;
  if(!l.steps.slice(0,len).some(Boolean))l.steps[Math.floor(Math.random()*len)]=1;
}

/* deterministic note logic, shared by sound and grid */
function hitIndex(l,g){let H=0,pre=0;const r=g%l.len;for(let s=0;s<l.len;s++)if(l.steps[s]){if(s<r)pre++;H++}return Math.floor(g/l.len)*H+pre}
function gapSteps(l,g){for(let k=1;k<=l.len;k++)if(l.steps[(g+k)%l.len])return k;return l.len}

/* rhythm in words */
function rhythmText(l){
  const h=[];for(let s=0;s<l.len;s++)if(l.steps[s])h.push(s);
  const eq=a=>a.length===h.length&&a.every((v,i)=>v===h[i]);
  if(!h.length)return"stille";
  if(l.len===16){
    if(eq([0,4,8,12]))return"hvert slag";
    if(eq([4,12]))return"på 2 og 4";
    if(eq([8]))return"på 3, halvtempo";
    if(eq([2,6,10,14]))return"offbeat";
    if(h.length===16)return"16-deler";
    if(eq([0,2,4,6,8,10,12,14]))return"8-deler";
    if(eq([0]))return"én gang per takt";
    return h.length+" treff per takt";
  }
  if(l.len===4){if(eq([2]))return"offbeat";if(h.length===4)return"16-deler";if(eq([0,2]))return"8-deler";if(eq([1,2,3]))return"3 etter hver kick";if(eq([0]))return"hvert slag";return"gjentas hvert slag"}
  if(l.len===2){if(eq([0]))return"8-deler";if(h.length===2)return"16-deler";return"offbeat-16-deler"}
  if(l.len===8)return"gjentas hver halve takt";
  if(l.len===32)return"gjentas hver 2. takt";
  return 16%l.len?`${beats(l.len)} slag, forskyves`:`gjentas hvert ${beats(l.len)}. slag`;
}

let lesson=null; // {kind:'rules'|'build', i, start}

  const g=G();
  if(lesson&&lesson.kind==="rules")return g.R;
  const st=g.L.map((d,gi)=>{const l=state.layers.find(x=>x.gi===gi);const nm=l?nameOf(l.sound):nameOf(d[0]);
    return{on:[gi],t:`**${nm}** · ${l?rhythmText(l):""}. ${d[5]||""}`}});
  st.push({on:null,final:true,t:autoFinal()});return st;
}
function autoFinal(){
  const odd=state.layers.filter(l=>16%l.len&&!l.mute),bars=cycleSteps()/16;
  if(odd.length){
    const parts=[...new Map(odd.map(l=>[l.len,l])).values()].map(l=>`${nameOf(l.sound).toLowerCase()} i ${beats(l.len)}`);
    return`**Alt sammen.** ${parts.join(" og ")} slag mot kickens 4. Derfor møtes alt hver **${bars}. takt**, og to takter på rad låter aldri helt likt.`;
  }
  return chordsOf(G()).length>1?`**Alt sammen.** Rytmen gjentas hver takt mens akkordene går ${progTxt()}.`:`**Alt sammen.** Alt går opp i én takt. Det er repetisjonen som gjør det hypnotisk.`;
}
function stepNow(){if(!lesson)return null;const st=lessonSteps();return st[Math.min(lesson.i,st.length-1)]}
function relBar(s){return lesson?Math.max(0,Math.floor((s-lesson.start)/16)):0}
function playsAt(i,s){
  if(!lesson)return true;
  const st=stepNow(),gi=state.layers[i].gi;
  if(!st||st.final)return true;
  if(lesson.kind==="build"){if(gi==null)return false;const all=lessonSteps();for(let k=0;k<=lesson.i;k++)if(all[k].on&&all[k].on.includes(gi))return true;return false}
  const rb=relBar(s)%4;
  if(st.only&&!st.only.includes(gi))return false;
  if(st.late&&st.late.includes(gi)&&rb<2)return false;
  if(st.gap&&st.gap.includes(gi)&&rb>=2)return false;
  return true;
}
function isFocus(i){const st=stepNow();if(!st||st.final||!st.on)return true;return st.on.includes(state.layers[i].gi)}

    state.layers.forEach((l,i)=>{if(!l.mute&&l.steps[stepIdx%l.len]&&playsAt(i,stepIdx))voice(l,t,stepIdx)});

  // beat lines + labels
  for(let b=0;b<4;b++){const x=gx+b*4*cw;g.strokeStyle="rgba(140,144,154,.22)";g.lineWidth=1;g.beginPath();g.moveTo(x,padT-4);g.lineTo(x,H-padB+2);g.stroke();
    g.fillStyle=MUTED;g.textAlign="left";g.font='500 11px "IBM Plex Mono", monospace';g.fillText(String(b+1),x+3,H-padB/2+2)}
  rows=[];
  state.layers.forEach((l,i)=>{
    const y=padT+i*(rh+gap),col=l.color,foc=!lesson||isFocus(i),dimA=l.mute?.25:(foc?1:.4);
    rows.push({i,y,h:rh,lw});
    // label
    g.textAlign="left";g.fillStyle=hexA(FG.replace("#","#"),1);
    g.globalAlpha=dimA;g.fillStyle=col;g.beginPath();g.arc(9,y+rh/2-(rh>34?7:0),4,0,7);g.fill();
    g.fillStyle=FG;g.font=`600 ${rh>34?13:12}px "IBM Plex Sans", sans-serif`;g.fillText(nameOf(l.sound),19,y+rh/2-(rh>34?7:0),lw-22);
    if(rh>34){g.fillStyle=MUTED;g.font='11px "IBM Plex Sans", sans-serif';g.fillText(l.mute?"dempet":rhythmText(l),19,y+rh/2+9,lw-22)}
    g.globalAlpha=1;
    // lane
    g.fillStyle=hexA(col,foc?.07:.03);rr(gx,y,gw,rh,6);g.fill();
    // pitches for melodic layers
    const role=roleOf(l.sound),mel=(role==="bass"||role==="lead")&&!CHORDAL.has(l.sound);
    const hits=[];for(let s=0;s<16;s++){const gs=g0+s;if(l.steps[gs%l.len])hits.push(s)}
    let mn=0,mx=0;if(mel&&hits.length){const ps=hits.map(s=>noteSemi(l,g0+s));mn=Math.min(...ps);mx=Math.max(...ps)}
    // restart markers
    if(16%l.len){for(let s=0;s<16;s++){if((g0+s)%l.len===0){const x=gx+s*cw;g.fillStyle=hexA(col,.85*dimA);g.beginPath();g.moveTo(x,y);g.lineTo(x+7,y);g.lineTo(x,y+7);g.closePath();g.fill()}}}
    hits.forEach(s=>{
      const gs=g0+s,w=Math.min(gapSteps(l,gs),DUR[l.sound]||1,16-s),x=gx+s*cw+1.5,ww=w*cw-3;
      const on=playsAt(i,gs)&&!l.mute,active=cur>=gs&&cur<gs+w&&on&&playing;
      let a=on?(foc?.95:.4):.12;
      g.fillStyle=active?FG:hexA(col,a);
      if(l.sound==="pad"||l.sound==="chord"){const hh=rh*.62;rr(x,y+(rh-hh)/2,ww,hh,5);g.fill();
        if(ww>28){g.fillStyle=active?"#000":hexA("#000000",.75);g.font='600 11px "IBM Plex Sans", sans-serif';g.textAlign="left";g.fillText(chordAt(gs).name,x+7,y+rh/2)}}
      else if(mel){const nh=Math.max(4,Math.min(10,rh*.18)),span=mx-mn||1,yy=y+rh-4-nh-((noteSemi(l,gs)-mn)/span)*(rh-8-nh);rr(x,mx===mn?y+rh/2-nh/2:yy,ww,nh,nh/2);g.fill()}
      else{const hh=rh*(role==="hat"?.5:role==="perc"||role==="fx"?.6:.78);rr(x,y+(rh-hh)/2,ww,hh,4);g.fill()}
    });
    if(!hits.length){g.fillStyle=MUTED;g.font='11px "IBM Plex Sans", sans-serif';g.textAlign="left";g.fillText("ingen treff i denne takten",gx+8,y+rh/2)}
  });
  // playhead
  if(cur>=0){const x=gx+(pos-g0)*cw;g.strokeStyle=FG;g.lineWidth=2;g.beginPath();g.moveTo(x,padT-6);g.lineTo(x,H-padB+2);g.stroke()}
}
/* ================= start wizard ================= */
const hadSaved=(()=>{try{return !!localStorage.getItem("pendelgroove-v4")}catch(e){return false}})();
let wiz={step:0,goal:null,fam:null};
const GOALS=[
 {id:"learn",t:"Lær en sjanger",p:"Hør 3 regler som forklarer hvordan sjangeren er bygd. Rutenettet viser det du hører.",rec:true,
  ic:'<path d="M4 6h16M4 12h16M4 18h10"/>'},
 {id:"build",t:"Bygg en låt",p:"Start med kicken og legg til ett lag om gangen, med forklaring underveis.",
  ic:'<path d="M4 20h16M7 16h10M10 12h4M12 4v4"/>'},
 {id:"jam",t:"Jam fritt",p:"Alt spiller med en gang. Mal inn slag, bytt lyder og lag nye varianter.",
  ic:'<circle cx="8" cy="17" r="3"/><circle cx="18" cy="15" r="3"/><path d="M11 17V5l10-2v12"/>'}];
function setSimple(on){document.body.classList.toggle("simple",on);$("adv").setAttribute("aria-pressed",String(!on));try{localStorage.setItem("pendelgroove-simple",on?"1":"0")}catch(e){}}
$("adv").onclick=()=>setSimple(!document.body.classList.contains("simple"));
function openWiz(){wiz={step:0,goal:null,fam:null};$("wiz").hidden=false;renderWiz()}
function closeWiz(){$("wiz").hidden=true}
function renderWiz(){
  const st=wiz.step,dots=[0,1,2].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("");
  let h=`<div class="wz-top"><span class="brand">PENDEL<br><span>GROOVE</span></span><div class="wz-dots" aria-label="Steg ${st+1} av 3">${dots}</div><button class="wz-skip" data-w="skip">Hopp over</button></div>`;
  if(st===0){
    h+=`<div class="wz-head"><div class="eyebrow">Steg 1 av 3</div><h1 id="wzT">Hva vil du <em>gjøre?</em></h1><p>Velg én ting å starte med. Du kommer tilbake hit ved å trykke på logoen øverst til venstre.</p></div>
    <div class="wz-grid goals">${GOALS.map(g=>`<button class="wz-card" data-goal="${g.id}">${g.rec?'<span class="rec">Anbefalt</span>':""}<svg class="gi" viewBox="0 0 24 24">${g.ic}</svg><h3>${g.t}</h3><p>${g.p}</p></button>`).join("")}</div>
    <div class="wz-foot">${hadSaved?`<button class="wz-resume" data-w="resume">Fortsett med ${G().name} ›</button>`:""}</div>`;
  }else if(st===1){
    h+=`<div class="wz-head"><div class="eyebrow">Steg 2 av 3</div><h1 id="wzT">Velg <em>stil</em></h1><p>Seks familier. Neste steg velger du type innen familien.</p></div>
    <div class="wz-grid">${FAMILIES.map(f=>{const b=f.subs.map(s=>s.bpm);return`<button class="wz-card" style="--fc:${f.c[0]}" data-fam="${f.id}"><h3><i></i>${f.name}</h3><p>${f.about}</p><small>${Math.min(...b)}–${Math.max(...b)} BPM</small><span class="tease">${f.subs.map(s=>s.name).join(" · ")}</span></button>`}).join("")}</div>
    <div class="wz-foot"><button class="wz-back" data-w="back">‹ Tilbake</button></div>`;
  }else{
    const f=FAMILIES.find(x=>x.id===wiz.fam),verb={learn:"Trykk på en type for å høre de 3 reglene.",build:"Trykk på en type for å bygge den lag for lag.",jam:"Trykk på en type for å starte."}[wiz.goal];
    h+=`<div class="wz-head"><div class="eyebrow">Steg 3 av 3 · ${f.name}</div><h1 id="wzT">Velg <em>type</em></h1><p>${verb} Lyden starter med en gang.</p></div>
    <div class="wz-grid subs3">${f.subs.map(s=>`<button class="wz-card" style="--fc:${s.acc}" data-sub="${s.id}"><h3><i></i>${s.name}</h3><small>${s.bpm} BPM · ${s.key}</small><p>${s.mood}. ${s.d}</p><span class="tease">Regel 1: <b>${s.R[0].t}</b></span></button>`).join("")}</div>
    <div class="wz-foot"><button class="wz-back" data-w="back">‹ Tilbake</button></div>`;
  }
  $("wzIn").innerHTML=h;$("wiz").scrollTop=0;
  const first=$("wzIn").querySelector(".wz-card");first&&first.focus({preventScroll:true});
}
function startFromWiz(id){
  if(lesson)setLesson(null);
  chooseGenre(id);closeWiz();
  if(wiz.goal==="jam"){setSimple(false);setView("pend");if(!playing)setPlaying(true)}
  else{setSimple(true);setView("grid");setLesson(wiz.goal==="build"?"build":"rules")}
}
$("wiz").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.goal){wiz.goal=b.dataset.goal;wiz.step=1;renderWiz()}
  else if(b.dataset.fam){wiz.fam=b.dataset.fam;wiz.step=2;renderWiz()}
  else if(b.dataset.sub)startFromWiz(b.dataset.sub);
  else if(b.dataset.w==="back"){wiz.step--;renderWiz()}
  else if(b.dataset.w==="skip"||b.dataset.w==="resume")closeWiz();
});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("wiz").hidden)closeWiz()});
$("home").onclick=()=>{if(playing)setPlaying(false);openWiz()};
try{setSimple(localStorage.getItem("pendelgroove-simple")!=="0")}catch(e){setSimple(true)}

syncAll();setView(view);openWiz();requestAnimationFrame(frame);
</script>
